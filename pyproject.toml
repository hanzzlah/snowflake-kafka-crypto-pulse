[project]
name = "crypto-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hanzzlah", email = "hanzlahyasir@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.1",
    "kafka-python>=3.0.11",
    "python-dotenv>=1.2.3",
    "snowflake-connector-python>=4.7.3",
    "snowflake-ingest>=1.0.13",
    "vadersentiment>=3.3.2",
    "websockets>=16.1.1",
]

[project.scripts]
crypto-pulse = "crypto_pulse:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
